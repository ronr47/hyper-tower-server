[package]
name = "native_metrics"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "native_metrics"
path = "src/main.rs"

[dependencies]
libc = "0.2"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
